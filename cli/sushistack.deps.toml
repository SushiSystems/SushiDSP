# SushiDSP dependency fragment — the dependencies SushiDSP owns. A reader
# aggregates this with whatever else is present and provisions the set; inside a
# SushiStack workspace that reader is `hub install`, and `sd setup` is the one
# outside it.
#
# One table per dependency, keyed by its name. This file used an array of
# [[dependency]] tables until 2026-09-22, which the reader skipped without a
# word, so nothing here was ever provisioned.
#
# SushiDSP depends on two SushiStack modules: SushiLog, the logger every Sushi library links, and
# SushiProfiler, which the zones of foundation/profile record into. Both are pinned below; the CLI
# builds or reuses each package through sushicore and hands CMake its config folder, so CMake
# never downloads or compiles either.
#
# GoogleTest is resolved via CMake FetchContent (see the root CMakeLists.txt),
# not a system/vcpkg port, so there is nothing to declare for it here.
#
# Field reference:
#   description    Human-readable purpose (shown by `hub doctor`).
#   required       false => a missing one warns but does not stop the build.
#   linux_apt      apt package names; empty list = not an apt/vcpkg package.
#   windows_vcpkg  vcpkg port names; empty list = not an apt/vcpkg package.
#   check_cmd      Optional command; exit 0 means "already installed".

[module]
depends_on = ["sushilog", "sushiprofiler"]

[sushisystems.sushilog]
version = "v0.3.0"
commit = "30e302383527d8db55403509d244acc6266809f6"

[sushisystems.sushiprofiler]
version = "v0.4.1"
commit = "fa97fde6d8b495a1856159c9929a000a817e5450"

[intel-llvm]
description = "intel/llvm clang++ (the workspace's shared toolchain). Optional: when present `sd` builds with it, otherwise with the platform compiler. SushiDSP compiles no SYCL; this is a C++ compiler preference."
required = false
linux_apt = []
windows_vcpkg = []

[sdl2]
description = "Audio device backend for applications/host (D1)."
required = true
linux_apt = ["libsdl2-dev"]
windows_vcpkg = ["sdl2"]
