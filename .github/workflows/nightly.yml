name: Nightly

# Once a day: everything post-merge runs, then the benchmarks. The benchmark table is reported
# and never gates. No test is quarantined today (docs/reference/KNOWN_ISSUES.md lists none), so
# there is no quarantined lane yet; the first quarantined test brings one.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  benchmarks:
    name: Benchmarks (Linux, reported)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Command
        run: echo "sd bench --type release"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the toolchain and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ccache lld
          python -m pip install -e ./cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc-bench-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-gcc-bench-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
      - name: Build
        run: sd build --type release -D SUSHIDSP_BUILD_SDL2=OFF -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run the benchmarks and report the table
        run: |
          sd bench --type release | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
