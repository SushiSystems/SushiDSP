# What this module is. `hub` reads this when the checkout sits in a workspace; SushiDSP is
# not in hub's catalog, so this file is the only thing that makes it recognisable there.
# The format: <sushistack>/docs/reference/MODULE_MANIFEST.md

[module]
name = "sushidsp"
alias = "sd"
distribution = "source"
repo = "https://github.com/SushiSystems/SushiDSP.git"
