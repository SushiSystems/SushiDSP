[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushidsp-cli"
version = "0.1.0"
description = "SushiDSP developer CLI (build / test)"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
requires-python = ">=3.10"
dependencies = [
    "sushicore>=0.3.0",
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
sd = "sushidsp.cli:app"
sushidsp = "sushidsp.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushidsp*"]

[tool.setuptools.package-data]
sushidsp = ["py.typed"]
