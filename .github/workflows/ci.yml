name: CI

# Pre-merge on every pull request, post-merge on every push to main. Every job calls the project
# CLI, `sd`, and prints the command it runs first. `gate` is the one check main requires.
#
# Pre-merge: the checkers, the build and the small and medium tests on Linux and Windows, and the
# small tests again under ASan and UBSan on Linux. Post-merge adds ThreadSanitizer.
# The CLI builds SushiLog and SushiProfiler once as packages from the commits cli/sushistack.deps.toml
# pins; no workflow step clones them.
# Large tests need an audio device and run on no runner; benchmarks and quarantined tests run in
# nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The suites never link the SDL2 host or the GUI; building them here costs time for no test.
  SD_DEFINES: -D SUSHIDSP_BUILD_SDL2=OFF

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Command
        shell: bash
        run: echo "python tools/check_all.py . && python -m pytest cli/tests -q"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the CLI
        run: python -m pip install -e "./cli[test]"
      - name: Run every checker
        run: python tools/check_all.py .
      - name: Run the CLI's own tests
        run: python -m pytest cli/tests -q

  linux:
    name: Build and small and medium tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Command
        run: echo "sd test --type release --label small --label medium"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the toolchain and the CLI
        # SDL2 needs the ALSA and PulseAudio headers; GLFW needs Wayland, X11 and EGL. This lane
        # builds the standalone host and the GUI, which no other lane compiles.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ccache lld pkg-config \
            libasound2-dev libpulse-dev libwayland-dev libwayland-bin wayland-protocols \
            libxkbcommon-dev xorg-dev libgl1-mesa-dev libegl1-mesa-dev
          python -m pip install -e ./cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-gcc-release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
      - name: Build every target, the host and the GUI included
        run: sd build --type release -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run the small and medium tests
        run: sd test --type release --label small --label medium

  windows:
    name: Build and small and medium tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Command
        shell: bash
        run: echo "sd test --type release --label small --label medium"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install the CLI
        run: python -m pip install -e ./cli
      # One command per step: pwsh reports only the last command's exit code.
      - name: Build
        shell: pwsh
        run: sd build --type release -D SUSHIDSP_BUILD_SDL2=OFF
      - name: Run the small and medium tests
        shell: pwsh
        run: sd test --type release --label small --label medium

  sanitize:
    name: Small tests under ${{ matrix.sanitizer }} (Linux, Clang)
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            labels: --label small
            post_merge_only: false
          - sanitizer: thread
            labels: --label small --label medium
            post_merge_only: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Command
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
        run: echo "sd test --type relwithdebinfo --sanitize ${{ matrix.sanitizer }} ${{ matrix.labels }}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
      - name: Install the toolchain and the CLI
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang lld ccache
          python -m pip install -e ./cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
        with:
          path: ~/.cache/ccache
          key: ccache-linux-clang-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-clang-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
      - name: Build
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
        run: >-
          sd build --type relwithdebinfo --sanitize ${{ matrix.sanitizer }} $SD_DEFINES
          -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_C_COMPILER=clang
          -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run the tests
        if: ${{ !matrix.post_merge_only || github.event_name != 'pull_request' }}
        run: sd test --type relwithdebinfo ${{ matrix.labels }}

  gate:
    name: Gate
    if: always()
    needs: [checks, linux, windows, sanitize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Command
        run: echo "test every pre-merge job result is success"
      - name: Require every pre-merge job
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.linux.result }} ${{ needs.windows.result }} ${{ needs.sanitize.result }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
