[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushidsp-cli"
version = "0.1.0"
description = "SushiDSP developer CLI (build / test)"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "sushicore==0.8.1",
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
sd = "sushidsp.cli:main"
sushidsp = "sushidsp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushidsp*"]

[tool.setuptools.package-data]
sushidsp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "small: one process and one thread, no network, no sleep, no file outside the build tree (60 s)",
    "medium: threads and processes, localhost, files in a temporary folder (300 s)",
    "large: real hardware, or a run longer than medium allows (900 s)",
]
