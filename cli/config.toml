# SushiDSP CLI configuration.
#
# Layering (lowest -> highest precedence):
#   built-in defaults  ->  this file  ->  config.local.toml  ->  SD_* env vars  ->  CLI flags
#
# This file is committed and holds shared / portable defaults. Machine-specific
# absolute paths (a pinned compiler, cmake, or ctest) belong in a gitignored
# `config.local.toml` next to this file, using the SAME section layout.
#
# SushiDSP pins no toolchain. `sd` looks for a C++17 compiler in this order and
# `sd config` says which one it found: an explicit `cxx` here, the intel/llvm
# clang++ a SushiStack workspace provisions (`hub install`), a clang++ on PATH,
# else CMake's platform default (MSVC via the Visual Studio generator on
# Windows, the system compiler elsewhere). A standalone checkout therefore
# needs no local config at all; a workspace upgrades the compiler by itself.
#
# [tool]
# cxx = "C:/path/to/clang++.exe"     # pin a compiler; also SD_CXX
# generator = "Ninja"                # pin a generator; also SD_CMAKE_GENERATOR
# ccache_exe = "C:/path/ccache.exe"  # pin the compiler cache the memory gate uses; also SD_CCACHE

[tool]
# Default executable this CLI's future `sd run` targets (host app, D1+).
target_bin = "sushidsp_host"
